name: Build & Upload to BrowserStack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build .app (no signing)
        run: |
          xcodebuild build \
            -project CPUBench.xcodeproj \
            -scheme CPUBench \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Verify .app contents
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/CPUBench.app"
          echo "=== .app contents ==="
          ls -la "$APP_PATH/"
          echo "=== Info.plist check ==="
          if [ -f "$APP_PATH/Info.plist" ]; then
            echo "Info.plist found"
            plutil -p "$APP_PATH/Info.plist" | head -20
          else
            echo "ERROR: Info.plist missing!"
            exit 1
          fi

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CPUBench.app Payload/
          zip -r CPUBench.ipa Payload

      - name: Upload to BrowserStack
        run: |
          RESP=$(curl -s -u "${{ secrets.BS_USER }}:${{ secrets.BS_KEY }}" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@CPUBench.ipa")
          echo "$RESP"
          APP_URL=$(echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("app_url",""))')
          if [ -z "$APP_URL" ]; then
            echo "WARNING: BrowserStack upload failed or no app_url returned"
          else
            echo "BS_APP_URL=$APP_URL" >> $GITHUB_ENV
          fi

      - name: Save app URL
        run: |
          echo "BrowserStack App URL: ${BS_APP_URL:-N/A}"
          echo "${BS_APP_URL:-}" > bs_app_url.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPUBench
          path: |
            CPUBench.ipa
            bs_app_url.txt
